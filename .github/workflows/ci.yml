# Test on every push/PR; on a push to main (after tests pass) fire Render's
# Deploy Hook so the live API rebuilds. Set the repository secret
# RENDER_DEPLOY_HOOK_URL to the hook URL from Render → your service → Settings → Deploy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/TicketDeskPro.UnitTests -c Release --nologo
      - name: Integration tests
        run: dotnet test tests/TicketDeskPro.IntegrationTests -c Release --nologo

  deploy:
    # Only pushes to main deploy; PRs just run the tests above.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Firing Render deploy hook…"
            curl -fsS -X POST "$DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping (Render auto-deploy may still be on)."
          fi
